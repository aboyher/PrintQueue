<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="38" fill="#4f46e5"/>
  <g transform="translate(96,96)">
    <!-- Printer body -->
    <rect x="-50" y="-20" width="100" height="50" rx="8" fill="white"/>
    <!-- Paper tray -->
    <rect x="-35" y="-45" width="70" height="30" rx="4" fill="#c7d2fe"/>
    <!-- Output paper -->
    <rect x="-30" y="25" width="60" height="25" rx="2" fill="#e2e8f0"/>
    <!-- Lines on paper -->
    <line x1="-20" y1="33" x2="20" y2="33" stroke="#94a3b8" stroke-width="2"/>
    <line x1="-20" y1="39" x2="15" y2="39" stroke="#94a3b8" stroke-width="2"/>
    <!-- Power button -->
    <circle cx="35" cy="-5" r="5" fill="#22c55e"/>
  </g>
</svg>
