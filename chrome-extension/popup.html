<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      color: #e2e8f0;
      margin: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #363650;
      border-radius: 8px;
      background: #2a2a3e;
      color: #e2e8f0;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #4f46e5;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: white;
    }
    .btn-primary:hover {
      background: #3730a3;
    }
    .btn-secondary {
      background: #2a2a3e;
      color: #94a3b8;
      margin-top: 8px;
    }
    .status {
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
    .success { background: #22c55e20; color: #22c55e; }
    .error { background: #ef444420; color: #ef4444; }
  </style>
</head>
<body>
  <h2>🖨️ PrintQueue</h2>

  <div class="field">
    <label>Server URL</label>
    <input type="url" id="server" placeholder="https://your-app.vercel.app" />
  </div>

  <button class="btn-primary" id="addBtn">Add Current Page to Queue</button>
  <button class="btn-secondary" id="openBtn">Open PrintQueue</button>

  <div id="status" class="status" style="display:none"></div>

  <script src="popup.js"></script>
</body>
</html>
